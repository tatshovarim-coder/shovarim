<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אנשי קשר</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
:root{--bg:#f3f5f9;--ink:#1e293b;--mut:#64748b;--line:#e2e8f0;--card:#fff;--ac:#2563eb;--ac2:#1d4ed8;--acs:#eaf1ff;--bad:#dc2626;--bads:#fee2e2;--soft:#f8fafc;--ok:#15803d;--star:#f59e0b}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font:15px/1.5 Heebo,'Segoe UI',Arial,sans-serif;background:radial-gradient(900px 480px at 88% -10%,#dbe7ff 0,transparent 60%),radial-gradient(700px 420px at 0% 105%,#e3efff 0,transparent 60%),var(--bg);background-attachment:fixed;display:flex;flex-direction:column;overflow:hidden}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
header{background:#ffffffcc;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;flex:none;z-index:20}
header h1{margin:0;font-size:18px;font-weight:700;white-space:nowrap}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);text-decoration:none;padding:6px 10px;border-radius:8px;font-size:14px;transition:background .15s,color .15s}
.back:hover{background:var(--acs);color:var(--ac2)}
.back svg{transform:scaleX(-1)}
.search{flex:1;max-width:460px;position:relative;margin-inline:auto}
.search svg{position:absolute;top:50%;right:12px;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.search input{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:8px 38px 8px 36px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
.search input:focus{background:#fff;border-color:#93b4f5;box-shadow:0 0 0 3px #2563eb1f}
.search .x{position:absolute;top:50%;left:8px;transform:translateY(-50%);border:0;background:none;color:var(--mut);padding:4px;border-radius:50%;display:none}
.search.has .x{display:block}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:7px 13px;font-weight:500;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--soft);border-color:#cbd5e1}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pri:hover{background:var(--ac2)}
.btn.bad{color:var(--bad)}
.btn.bad:hover{background:var(--bads);border-color:#fca5a5}
.ib{width:36px;height:36px;display:inline-grid;place-items:center;border:0;background:none;border-radius:10px;color:var(--mut);transition:background .15s,color .15s}
.ib:hover{background:var(--acs);color:var(--ac2)}
.ib.on{color:var(--star)}
.ib.on svg{fill:var(--star)}
#menuBtn,#burger{position:relative}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:230px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px #0f172a24;padding:6px;z-index:50;animation:dlgIn .2s both}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;text-align:right;padding:9px 12px;border-radius:9px;color:var(--ink)}
.menu button:hover{background:var(--acs)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.menu .lbl{font-size:12px;color:var(--mut);padding:6px 12px 2px}
.menu button.cur{color:var(--ac2);font-weight:700}

/* layout */
.app{flex:1;min-height:0;display:grid;grid-template-columns:230px 360px 1fr;gap:0}
aside{border-inline-end:1px solid var(--line);background:#ffffffa6;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:right;padding:9px 12px;border-radius:11px;color:var(--ink);transition:background .15s}
.nav:hover{background:#eef2f9}
.nav.on{background:var(--acs);color:var(--ac2);font-weight:700}
.nav .n{margin-inline-start:auto;font-size:12px;color:var(--mut);background:#f1f5f9;border-radius:99px;padding:0 8px;min-width:24px;text-align:center}
.nav.on .n{background:#fff;color:var(--ac2)}
.side-h{display:flex;align-items:center;justify-content:space-between;color:var(--mut);font-size:12px;font-weight:700;padding:14px 12px 4px;letter-spacing:.02em}
.side-h button{border:0;background:none;color:var(--ac2);font-weight:700;font-size:12px;padding:2px 6px;border-radius:6px}
.side-h button:hover{background:var(--acs)}
.gdot{width:10px;height:10px;border-radius:50%;flex:none}

.listpane{display:flex;flex-direction:column;min-height:0;border-inline-end:1px solid var(--line);background:#ffffffd9}
.lh{padding:12px 16px 8px;display:flex;align-items:center;gap:8px;flex:none}
.lh h2{margin:0;font-size:17px;flex:1}
.lh small{color:var(--mut);font-weight:400;font-size:13px;margin-inline-start:6px}
.bulk{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--acs);border-block:1px solid #c3d6fb;flex:none;flex-wrap:wrap}
.bulk b{margin-inline-end:auto;color:var(--ac2)}
.bulk .btn{padding:5px 10px;font-size:13px}
.lwrap{flex:1;min-height:0;position:relative;display:flex}
#list{flex:1;overflow:auto;padding:0 6px 80px;scroll-behavior:smooth}
.sec{position:sticky;top:0;z-index:2;background:#f3f6fbee;backdrop-filter:blur(6px);color:var(--ac2);font-weight:800;font-size:13px;padding:4px 12px;border-radius:8px;margin:6px 0 2px}
.row{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:13px;cursor:pointer;transition:background .12s;user-select:none}
.row:hover{background:#eef2f9}
.row.on{background:var(--acs)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{color:var(--star);display:flex}
.row .st svg{width:15px;height:15px;fill:var(--star);stroke:var(--star)}
.row .ck{width:20px;height:20px;border-radius:6px;border:2px solid #cbd5e1;display:none;place-items:center;flex:none;background:#fff;color:#fff}
.selmode .row .ck{display:grid}
.row.pk .ck{background:var(--ac);border-color:var(--ac)}
.row .ck svg{width:13px;height:13px;stroke-width:3.2}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;flex:none;overflow:hidden;background-size:cover;background-position:center}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.az{width:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:10px;color:var(--mut);padding:4px 0;flex:none;overflow:hidden}
.az button{border:0;background:none;color:inherit;font-size:10.5px;line-height:1.35;padding:0 4px;font-weight:700}
.az button:hover{color:var(--ac2)}
.fab{position:absolute;bottom:16px;left:16px;width:54px;height:54px;border-radius:18px;border:0;background:linear-gradient(135deg,var(--ac),#4f8ff7);color:#fff;display:none;place-items:center;box-shadow:0 10px 24px #2563eb55}
.fab svg{width:24px;height:24px;stroke-width:2.4}
.empty{text-align:center;color:var(--mut);padding:50px 24px}
.empty .big{width:76px;height:76px;margin:0 auto 14px;border-radius:24px;background:var(--acs);color:var(--ac2);display:grid;place-items:center}
.empty .big svg{width:36px;height:36px}
.empty h3{margin:0 0 6px;color:var(--ink)}

/* detail */
.detail{overflow:auto;padding:28px 32px 60px;min-width:0}
.dcard{max-width:640px;margin:0 auto;animation:rise .35s both}
.dtop{display:flex;align-items:center;gap:20px;margin-bottom:18px}
.dtop .av{width:104px;height:104px;font-size:40px;box-shadow:0 10px 26px #0f172a25}
.dtop h2{margin:0;font-size:27px;line-height:1.2;font-weight:800;word-break:break-word}
.dtop p{margin:3px 0 0;color:var(--mut)}
.dtop .tools{margin-inline-start:auto;align-self:flex-start;display:flex;gap:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:2px 11px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:10px;margin-bottom:18px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-decoration:none;color:var(--ac2);font-size:13px;font-weight:500;transition:transform .15s,box-shadow .15s,border-color .15s}
.act:hover{transform:translateY(-3px);box-shadow:0 10px 22px #2563eb1f;border-color:#b7cffa}
.act svg{width:22px;height:22px}
.act.dis{opacity:.4;pointer-events:none}
.block{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:14px;overflow:hidden}
.fld{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.fld:first-child{border-top:0}
.fld .k{width:64px;flex:none;color:var(--mut);font-size:12.5px}
.fld .v{flex:1;min-width:0;word-break:break-word}
.fld .v a{color:var(--ac2);text-decoration:none}
.fld .v a:hover{text-decoration:underline}
.fld .v bdi{unicode-bidi:isolate}
.fld .mini{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.fld:hover .mini,.fld:focus-within .mini{opacity:1}
.mini a,.mini button{width:30px;height:30px;display:grid;place-items:center;border:0;background:none;border-radius:8px;color:var(--mut);text-decoration:none}
.mini a:hover,.mini button:hover{background:var(--acs);color:var(--ac2)}
.mini svg{width:16px;height:16px}
.notes{white-space:pre-wrap}
.meta{color:var(--mut);font-size:12.5px;text-align:center;margin-top:14px}
.dempty{height:100%;display:grid;place-items:center;color:var(--mut);text-align:center}
.back-l{display:none}

/* dups */
.dup{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;margin:8px 4px}
.dup .why{font-size:12.5px;color:var(--warn,#b45309);background:#fef1dc;border-radius:99px;display:inline-block;padding:1px 10px;margin:2px 4px 6px}
.dup .row{cursor:default}
.dup .row:hover{background:none}
.dup .bar{display:flex;gap:8px;padding:6px 4px 2px}

/* dialogs */
dialog{border:0;border-radius:22px;padding:0;box-shadow:0 30px 80px #0f172a45;width:min(560px,94vw);max-height:92vh;color:var(--ink);background:#fff}
dialog::backdrop{background:#0f172a66;backdrop-filter:blur(3px)}
dialog.sm{width:min(400px,94vw)}
.dform{display:flex;flex-direction:column;max-height:92vh}
.dh{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex:none}
.dh h2{margin:0;font-size:18px;flex:1}
.db{padding:18px 22px;overflow:auto;flex:1}
.df{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex:none;background:var(--soft)}
.pic{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.pic .av{width:78px;height:78px;font-size:30px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.l{display:block;font-size:12.5px;color:var(--mut);margin:12px 0 4px;font-weight:500}
.g2 label.l:first-child{margin-top:0}
.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;outline:none;transition:border-color .15s,box-shadow .15s}
.in:focus{border-color:#93b4f5;box-shadow:0 0 0 3px #2563eb1f}
textarea.in{min-height:84px;resize:vertical}
.multi{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;gap:6px}
.mrow select{width:92px;flex:none}
.mrow .in:nth-child(2){flex:1}
.add{border:0;background:none;color:var(--ac2);font-weight:700;padding:6px 2px;display:inline-flex;align-items:center;gap:6px;align-self:flex-start}
.gpick{display:flex;flex-wrap:wrap;gap:6px}
.gpick label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 12px;cursor:pointer;user-select:none;font-size:13.5px}
.gpick input{display:none}
.gpick label:has(input:checked){background:var(--acs);border-color:#93b4f5;color:var(--ac2);font-weight:700}
.err{color:var(--bad);font-size:13px;margin-inline-end:auto;align-self:center}
.plist{display:flex;flex-direction:column;gap:6px}
.plist button{display:flex;align-items:center;gap:10px;width:100%;text-align:right;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px}
.plist button:hover{background:var(--acs)}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:0 14px 34px #0f172a50;max-width:92vw}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{border:0;background:none;color:#7fb0ff;font-weight:700;padding:0}
.overlay{position:fixed;inset:0;z-index:150;background:#2563ebcc;color:#fff;display:none;place-items:center;font-size:24px;font-weight:700;backdrop-filter:blur(4px)}
.overlay.on{display:grid}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

/* responsive */
@media(max-width:1020px){.app{grid-template-columns:340px 1fr}aside{position:fixed;inset:0 0 0 auto;width:260px;z-index:60;background:#fff;transform:translateX(105%);transition:transform .25s}body.side aside{transform:none;box-shadow:-20px 0 50px #0f172a30}.scrim{display:none}body.side .scrim{display:block;position:fixed;inset:0;background:#0f172a55;z-index:55}}
@media(min-width:1021px){#burger{display:none}.scrim{display:none!important}}
@media(max-width:760px){
 .app{grid-template-columns:1fr}
 .listpane{border:0}
 .detail{position:fixed;inset:0;z-index:40;background:var(--bg);padding:14px 16px 60px;transform:translateX(-102%);transition:transform .25s}
 body.showd .detail{transform:none}
 .back-l{display:inline-flex}
 .dtop{flex-wrap:wrap;gap:14px}.dtop .av{width:84px;height:84px;font-size:32px}
 .dtop .tools{margin:0}
 .fab{display:grid}
 .hide-m{display:none}
 .back .t{display:none}
 .fld .mini{opacity:1}
 .g2{grid-template-columns:1fr}
}
@media print{header,aside,.listpane,.acts,.tools,.mini,.back-l{display:none!important}.detail{position:static;transform:none;overflow:visible}body{display:block;overflow:visible;background:#fff}.app{display:block}}
</style>
</head>
<body>
<div id="topbar"></div>
<header>
  <a class="back" href="index.html"><svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span class="t">תפריט</span></a>
  <button class="ib" id="burger" aria-label="תפריט צד"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <h1 class="hide-m">אנשי קשר</h1>
  <div class="search" id="sbox">
    <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="חיפוש לפי שם, טלפון, מייל, הערה…   ( / )" autocomplete="off" aria-label="חיפוש">
    <button class="x" id="qx" aria-label="ניקוי חיפוש"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <button class="btn pri hide-m" data-act="new"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>איש קשר חדש</button>
  <div style="position:relative">
    <button class="ib" id="menuBtn" aria-label="עוד אפשרויות" aria-haspopup="true"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg></button>
    <div class="menu" id="menu" hidden></div>
  </div>
</header>
<div class="scrim" id="scrim"></div>
<div class="app" id="appEl">
  <aside id="side"></aside>
  <section class="listpane" id="lp">
    <div class="lh"><h2 id="vt">כל אנשי הקשר</h2>
      <button class="ib" data-act="selmode" title="בחירה מרובה" aria-label="בחירה מרובה"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></svg></button>
    </div>
    <div class="bulk" id="bulk" hidden></div>
    <div class="lwrap"><div id="list"></div><div class="az" id="az"></div>
      <button class="fab" data-act="new" aria-label="איש קשר חדש"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
  </section>
  <main class="detail" id="detail"></main>
</div>

<dialog id="dlgE"></dialog>
<dialog id="dlgG" class="sm"></dialog>
<dialog id="dlgP" class="sm"></dialog>
<input type="file" id="file" accept=".vcf,.csv,.json,text/vcard,text/csv,application/json" hidden>
<input type="file" id="photoIn" accept="image/*" hidden>
<div id="toast"></div>
<div class="overlay" id="drop">שחררו כאן כדי לייבא אנשי קשר</div>

<script src="firebase-config.js"></script>
<script src="sync.js"></script>
<script>
(function(){
'use strict';

var undoSnap=null,toastT=null;

 phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',

 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
 star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
 edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>',

 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0M16 4.5a3.5 3.5 0 0 1 0 7M22 20a7 7 0 0 0-4-6.3"/>',

/* ---------- utils ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function digits(s){return String(s||'').replace(/\D/g,'')}
function telHref(s){return 'tel:'+String(s).replace(/[^\d+]/g,'')}
function gmail(a){return 'https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(a)}
function waNum(s){var d=digits(s),p=String(s).trim().charAt(0)==='+';if(p)return d;if(d.indexOf('00')===0)return d.slice(2);if(d.charAt(0)==='0')return '972'+d.slice(1);return d}
function toast(t,label,fn){var el=$('toast');el.innerHTML='<span>'+esc(t)+'</span>'+(label?'<button>'+esc(label)+'</button>':'');if(label)el.querySelector('button').onclick=function(){fn();el.classList.remove('show')};el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show')},label?6500:2400)}
function normHe(ch){return({'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'})[ch]||ch}
function fullName(c){return [c.first,c.last].filter(Boolean).join(' ').trim()}
function title(c){return fullName(c)||c.company||(c.phones[0]&&c.phones[0].value)||(c.emails[0]&&c.emails[0].value)||'ללא שם'}
function sortKey(c){var a=S.sortBy==='last'?[c.last,c.first,c.company]:[c.first,c.last,c.company];var k=(a[0]||a[1]||a[2]||'').trim();return k||'~'}
function letter(c){var k=sortKey(c);if(k==='~')return '#';var ch=normHe(k.charAt(0).toUpperCase());if(/[\u05d0-\u05ea]/.test(ch)||/[A-Z]/.test(ch))return ch;return '#'}
function cmpKey(a,b){var ra=/[\u05d0-\u05ea]/.test(a.charAt(0))?0:/[A-Za-z]/.test(a.charAt(0))?1:2,rb=/[\u05d0-\u05ea]/.test(b.charAt(0))?0:/[A-Za-z]/.test(b.charAt(0))?1:2;return ra-rb||a.localeCompare(b,'he')}
function initials(c){var f=(c.first||'').trim().charAt(0),l=(c.last||'').trim().charAt(0);var s=(f+l)||(c.company||'').trim().charAt(0)||'';return s.toUpperCase()}
function color(c){var s=title(c),h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return COLORS[Math.abs(h)%COLORS.length]}
function avatar(c,cls){var st='background:'+color(c);if(c.photo)return '<div class="av '+(cls||'')+'">'+'<img alt="" src="'+esc(c.photo)+'"></div>';var i=initials(c);return '<div class="av '+(cls||'')+'" style="'+st+'">'+(i?esc(i):ic('user'))+'</div>'}
function groupById(id){for(var i=0;i<S.groups.length;i++)if(S.groups[i].id===id)return S.groups[i]}
function byId(id){for(var i=0;i<S.contacts.length;i++)if(S.contacts[i].id===id)return S.contacts[i]}
function blank(){return{id:uid(),first:'',last:'',company:'',jobTitle:'',phones:[],emails:[],address:'',website:'',notes:'',fav:false,groups:[],photo:'',created:Date.now(),updated:Date.now()}}
function fixC(c){var b=blank();for(var k in b)if(c[k]==null)c[k]=b[k];c.phones=(c.phones||[]).filter(function(p){return p&&p.value});c.emails=(c.emails||[]).filter(function(p){return p&&p.value});c.groups=c.groups||[];return c}

/* ---------- storage: IndexedDB (מקום גדול), עם גיבוי ל-localStorage ---------- */
var idb=null,bc=null,migrating=false;
try{bc=new BroadcastChannel('contactsSync')}catch(e){}
function idbOpen(cb){var done=false;function fin(){if(!done){done=true;cb()}}
  try{var r=indexedDB.open('contactsDB',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};
    r.onsuccess=function(){idb=r.result;fin()};r.onerror=fin;r.onblocked=fin}catch(e){fin()}}
function idbGet(k,cb){if(!idb)return cb(undefined);
  try{var q=idb.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){cb(q.result)};q.onerror=function(){cb(undefined)}}catch(e){cb(undefined)}}
function idbPut(k,v,ok,fail){if(!idb)return fail();
  try{var tx=idb.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=ok;tx.onerror=fail;tx.onabort=fail}catch(e){fail()}}
function applyData(d){if(d){S.contacts=(d.contacts||[]).map(fixC);S.groups=d.groups||[];S.sortBy=d.sortBy||'first'}
  var lim=Date.now()-30*864e5;S.contacts=S.contacts.filter(function(c){return !c.deleted||c.deleted>lim})}
function load(cb){idbOpen(function(){idbGet(KEY,function(d){
  if(!d){/* מעבר חד-פעמי מהאחסון הישן */
    try{var old=JSON.parse(localStorage.getItem(KEY)||'null');if(old){d=old;migrating=true}}catch(e){}}
  applyData(d);if(migrating)persist();
  setTimeout(cb,0)})})}
function persist(){var data={contacts:S.contacts,groups:S.groups,sortBy:S.sortBy};
  idbPut(KEY,data,function(){
    if(migrating){migrating=false;try{localStorage.removeItem(KEY)}catch(e){}}
    if(bc)try{bc.postMessage('changed')}catch(e){}
  },function(){
    try{localStorage.setItem(KEY,JSON.stringify(data))}
    catch(e){toast('לא ניתן לשמור: האחסון בדפדפן מלא. מומלץ לייצא גיבוי ולהסיר תמונות.')}})}
function save(){pushRemote();persist()}
function snap(){undoSnap=JSON.stringify({c:S.contacts,g:S.groups})}
function undo(){if(!undoSnap)return;var d=JSON.parse(undoSnap);S.contacts=d.c;S.groups=d.g;undoSnap=null;save();renderAll();toast('הפעולה בוטלה')}
function done(msg){save();renderAll();toast(msg,'ביטול',undo)}

/* ---------- query ---------- */
function live(){return S.contacts.filter(function(c){return !c.deleted})}
function hay(c){var g=c.groups.map(function(i){var x=groupById(i);return x?x.name:''}).join(' ');return [c.first,c.last,c.company,c.jobTitle,c.address,c.website,c.notes,g].concat(c.phones.map(function(p){return p.value+' '+digits(p.value)}),c.emails.map(function(p){return p.value})).join(' ').toLowerCase()}
function filtered(){
  var v=S.view,arr;
  if(v==='trash')arr=S.contacts.filter(function(c){return c.deleted});
  else{arr=live();
    if(v==='fav')arr=arr.filter(function(c){return c.fav});
    else if(v.indexOf('g:')===0){var gid=v.slice(2);arr=arr.filter(function(c){return c.groups.indexOf(gid)>-1})}
    else if(v==='nophone')arr=arr.filter(function(c){return !c.phones.length});
  }
  if(S.q){var q=S.q.toLowerCase().trim(),dq=digits(q),words=q.split(/\s+/);
    arr=arr.filter(function(c){var h=hay(c);return words.every(function(w){return h.indexOf(w)>-1})||(dq.length>=3&&h.indexOf(dq)>-1)})}
  arr.sort(function(a,b){return cmpKey(sortKey(a),sortKey(b))||sortKey(a).localeCompare(sortKey(b),'he')});
  return arr;
}

/* ---------- duplicates ---------- */
function dupSets(){
  var l=live(),parent={};
  function f(x){while(parent[x]!==x)x=parent[x]=parent[parent[x]];return x}
  l.forEach(function(c){parent[c.id]=c.id});
  var keys={};
  function add(k,id,why){if(!k)return;(keys[k]=keys[k]||{ids:[],why:why}).ids.push(id)}
  l.forEach(function(c){
    c.phones.forEach(function(p){var d=digits(p.value).replace(/^972/,'0');if(d.length>=7)add('p'+d.slice(-9),c.id,'אותו מספר טלפון')});
    c.emails.forEach(function(p){add('e'+p.value.trim().toLowerCase(),c.id,'אותו מייל')});
    var n=fullName(c).toLowerCase().replace(/\s+/g,' ');if(n.indexOf(' ')>-1||n.length>3)add('n'+n,c.id,'אותו שם');
  });
  var why={};
  Object.keys(keys).forEach(function(k){var ids=keys[k].ids.filter(function(x,i,a){return a.indexOf(x)===i});if(ids.length>1){ids.forEach(function(x){parent[f(x)]=f(ids[0])});why[ids[0]]=keys[k].why}});
  var groups={};l.forEach(function(c){var r=f(c.id);(groups[r]=groups[r]||[]).push(c)});
  return Object.keys(groups).map(function(r){var g=groups[r];if(g.length<2)return null;var ws=[];Object.keys(keys).forEach(function(k){var ids=keys[k].ids;var inG=ids.filter(function(i){return g.some(function(c){return c.id===i})});if(inG.length>1&&ws.indexOf(keys[k].why)<0)ws.push(keys[k].why)});return{items:g,why:ws}}).filter(Boolean);
}
function renderDups(){
  var sets=dupSets();
  if(!sets.length){$('list').innerHTML='<div class="empty"><div class="big">'+ic('check')+'</div><h3>לא נמצאו כפילויות</h3><p>הכול נקי ומסודר.</p></div>';$('vt').innerHTML='כפילויות';return}
  $('vt').innerHTML='כפילויות<small>'+sets.length+'</small>';

    if(exists){skipped++;return}
    var cats=c._cats||[];delete c._cats;
    cats.forEach(function(n){var g=S.groups.filter(function(x){return x.name===n})[0];if(!g){g={id:uid(),name:n,color:GCOL[S.groups.length%GCOL.length]};S.groups.push(g)}if(c.groups.indexOf(g.id)<0)c.groups.push(g.id)});
    c.id=uid();c.created=c.created||Date.now();c.updated=Date.now();delete c.deleted;S.contacts.push(c);added++;
  });
  done('יובאו '+added+' אנשי קשר'+(skipped?' ('+skipped+' כפולים דולגו)':''));
}
function readFiles(files){Array.prototype.forEach.call(files,function(f){var fr=new FileReader();fr.onload=function(){importText(f.name,String(fr.result))};fr.readAsText(f)})}

function allText(c){var L=[title(c)];if(c.company&&fullName(c))L.push(c.company);c.phones.forEach(function(p){L.push((PL[p.label]||'טלפון')+': '+p.value)});c.emails.forEach(function(p){L.push(p.value)});if(c.address)L.push(c.address);if(c.website)L.push(c.website);return L.join('\n')}
function pickedIds(){return Object.keys(S.picked)}
function trashIds(ids){snap();var t=Date.now();ids.forEach(function(i){var c=byId(i);if(c){c.deleted=t;c.fav=c.fav}});if(S.sel&&ids.indexOf(S.sel)>-1){S.sel=null;document.body.classList.remove('showd')}}

var A={
 'new':function(){openEditor()},

 fav:function(b){var c=byId(b.dataset.id);c.fav=!c.fav;c.updated=Date.now();save();renderAll()},
 del:function(b){trashIds([b.dataset.id]);done('איש הקשר הועבר לפח')},
 restore:function(b){snap();var c=byId(b.dataset.id);delete c.deleted;if(S.view==='trash'){S.sel=null;document.body.classList.remove('showd')}done('איש הקשר שוחזר')},
 purge:function(b){if(!confirm('למחוק לצמיתות? לא ניתן לשחזר.'))return;S.contacts=S.contacts.filter(function(c){return c.id!==b.dataset.id});S.sel=null;document.body.classList.remove('showd');save();renderAll();toast('נמחק לצמיתות')},
 'empty-trash':function(){if(!confirm('לרוקן את הפח? המחיקה סופית.'))return;S.contacts=S.contacts.filter(function(c){return !c.deleted});S.sel=null;save();renderAll();toast('הפח רוקן')},
 vcf1:function(b){var c=byId(b.dataset.id);download(title(c).replace(/[\\/:*?"<>|]/g,'')+'.vcf',toVcf([c]),'text/vcard')},
 copyall:function(b){copy(allText(byId(b.dataset.id)),'הפרטים הועתקו')},
 closed:function(){document.body.classList.remove('showd')},
 selmode:function(){S.selmode=!S.selmode;S.picked={};renderList()},
 selall:function(){filtered().forEach(function(c){S.picked[c.id]=1});renderList()},
 'bulk-del':function(){var ids=pickedIds();if(!ids.length)return;trashIds(ids);endSel();done(ids.length+' אנשי קשר הועברו לפח')},
 'bulk-restore':function(){var ids=pickedIds();if(!ids.length)return;snap();ids.forEach(function(i){delete byId(i).deleted});endSel();done('שוחזרו '+ids.length)},
 'bulk-purge':function(){var ids=pickedIds();if(!ids.length||!confirm('למחוק '+ids.length+' אנשי קשר לצמיתות?'))return;S.contacts=S.contacts.filter(function(c){return ids.indexOf(c.id)<0});endSel();save();renderAll();toast('נמחקו לצמיתות')},
 'bulk-group':function(){var ids=pickedIds();if(ids.length)pickGroup(ids)},
 'bulk-export':function(){var ids=pickedIds();if(ids.length)exportAs('vcf',ids.map(byId))},
 newgroup:function(){groupDialog()},
 import:function(){$('file').click()},
 merge:function(b){var set=dupSets()[+b.dataset.set];if(!set)return;snap();var m=mergeContacts(set.items.slice());S.sel=m.id;done('אנשי הקשר מוזגו')}
};

document.addEventListener('click',function(e){
  var t=e.target;
  var m=t.closest('[data-act]');
  if(m&&A[m.dataset.act]){closeMenu();A[m.dataset.act](m);return}
  var cp=t.closest('[data-copy]');if(cp){copy(cp.dataset.copy);return}
  var v=t.closest('[data-view]');if(v){S.view=v.dataset.view;S.sel=null;S.picked={};document.body.classList.remove('side','showd');$('list').scrollTop=0;renderAll();return}
  var az=t.closest('[data-az]');if(az){var s=$('sec-'+az.dataset.az);if(s)$('list').scrollTo({top:s.offsetTop-4});return}
  var cl=t.closest('[data-close]');if(cl){var d=cl.closest('dialog');if(d)d.close();return}
  var r=t.closest('.row[data-id]');
  if(r&&!r.closest('.dup')){var id=r.dataset.id;if(S.selmode){if(S.picked[id])delete S.picked[id];else S.picked[id]=1;renderList()}else{S.sel=id;showDetail()}return}
  if(!t.closest('#menu')&&!t.closest('#menuBtn'))closeMenu();
});
document.addEventListener('keydown',function(e){
  var tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('row')){e.target.click();return}
  if(tag==='input'||tag==='textarea'||tag==='select'){if(e.key==='Escape'&&e.target.id==='q'){e.target.value='';S.q='';renderAll();e.target.blur()}return}
  if(document.querySelector('dialog[open]'))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='/'){e.preventDefault();$('q').focus()}
  else if(e.key==='n'||e.key==='N'||e.key==='מ'&&false){e.preventDefault();openEditor()}
  else if(e.key==='Escape'){if(S.selmode)endSel();else{closeMenu();document.body.classList.remove('side','showd')}}
  else if(e.key==='Delete'&&S.sel&&byId(S.sel)&&!byId(S.sel).deleted){trashIds([S.sel]);done('איש הקשר הועבר לפח')}
});

/* ---------- Firebase sync (שיתוף בין כל המשתמשים) ---------- */
var remoteReady=false,lastRemote={},lastGroups='[]';
function pushRemote(){
  if(!remoteReady)return;
  var up={},now={},n=0;
  S.contacts.forEach(function(c){now[c.id]=1;var j=JSON.stringify(c);if(lastRemote[c.id]!==j){up['items/'+c.id]=JSON.parse(j);lastRemote[c.id]=j;n++}});
  Object.keys(lastRemote).forEach(function(id){if(!now[id]){up['items/'+id]=null;delete lastRemote[id];n++}});
  var gj=JSON.stringify(S.groups);
  if(gj!==lastGroups){up['groups']=S.groups.length?JSON.parse(gj):null;lastGroups=gj;n++}
  if(n)YSync.update('contacts',up).catch(function(){toast('השמירה בענן נכשלה')});
}
function startSync(){
  if(!window.YSync)return;
  YSync.ready.then(function(ok){
    if(!ok)return;
    var first=true;
    YSync.onValue('contacts',function(d){
      d=d||{};
      var items=d.items||{},ids=Object.keys(items);
      if(first){
        first=false;
        /* ענן ריק + יש נתונים מקומיים: מעלים אותם (העלאה ראשונה) */
        if(!ids.length&&!d.groups&&(S.contacts.length||S.groups.length)){remoteReady=true;lastRemote={};lastGroups='';pushRemote();return}
      }
      var arr=ids.map(function(k){return fixC(items[k])});
      lastRemote={};arr.forEach(function(x){lastRemote[x.id]=JSON.stringify(x)});
      var g=d.groups||[];if(!Array.isArray(g))g=Object.keys(g).map(function(k){return g[k]});
      lastGroups=JSON.stringify(g);
      var lim=Date.now()-30*864e5;
      S.contacts=arr.filter(function(x){return !x.deleted||x.deleted>lim});S.groups=g;
      remoteReady=true;
      persist();
      renderAll();
    });
  });
}
